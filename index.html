<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disiplin & Rutin Takip</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #13131a;
            --accent-color: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; padding-bottom: 50px; }
        header { margin: 15px 0 25px 0; text-align: center; }
        header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .section-card { background-color: var(--card-bg); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid #1f1f2e; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f1f2e; padding-bottom: 8px; }
        .quick-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .tag-btn { background-color: #1f1f2e; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; border: 1px solid #2e2e42; cursor: pointer; }
        .tag-btn:active { background-color: var(--accent-color); color: white; }
        .progress-container { background-color: #1f1f2e; border-radius: 8px; height: 12px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; }
        .progress-bar { background-color: var(--success-color); height: 100%; width: 0%; transition: width 0.3s ease; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
        input, textarea { background-color: #1f1f2e; border: 1px solid #2e2e42; color: white; padding: 12px; border-radius: 8px; font-size: 0.9rem; flex: 1; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 18px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        button:active { opacity: 0.8; }
        .summary-text { font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; }
        .list-item { background-color: #1a1a26; padding: 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; border-left: 3px solid var(--accent-color); }
        .delete-btn { background: none; color: var(--danger-color); padding: 0; font-size: 0.85rem; }
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; background-color: #1a1a26; border-radius: 8px; margin-bottom: 8px; border: 1px solid #232334; }
        .check-item label { font-size: 0.95rem; display: flex; align-items: center; gap: 12px; width: 100%; cursor: pointer; }
        .check-item input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--success-color); }
        .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background-color: #1a1a26; padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #232334; }
        .stat-val { font-size: 1.3rem; font-weight: 800; margin: 6px 0; color: var(--warning-color); }
        .blue-val { color: #38bdf8 !important; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .action-grid button { padding: 8px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>BODYBUILDING & DISİPLİN</h1>
        <p>Disiplin yeteneği yener.</p>
    </header>

    <div class="section-card">
        <div class="section-title">
            <span>Makro & Kalori Takibi</span>
            <button onclick="clearNutrition()" class="delete-btn">Sıfırla</button>
        </div>
        <div class="quick-tags">
            <span class="tag-btn" onclick="quickAdd('Tantuni Dürüm', 180, 420, 28)">+ 180g Tantuni</span>
            <span class="tag-btn" onclick="quickAdd('Sarı Leblebi', 50, 180, 10)">+ 50g Leblebi</span>
            <span class="tag-btn" onclick="quickAdd('Yulaf Ezmesi', 60, 220, 7)">+ 60g Yulaf</span>
            <span class="tag-btn" onclick="quickAdd('Tavuk Pilav', 300, 550, 40)">+ Tavuk Pilav</span>
        </div>
        <div class="summary-text">
            <span id="nutrition-summary">0 / 2100 kcal</span>
            <span id="protein-summary">0g / 150g Protein</span>
        </div>
        <div class="progress-container
